<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QQbox 数据库管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header>
        <div>
          <p class="eyebrow">QQBOX DATABASE</p>
          <h1>用户资料管理</h1>
          <p class="subtitle">直接维护气泡使用的用户名称、头衔与颜色。</p>
        </div>
        <button id="new-profile" class="primary" type="button">新增用户</button>
      </header>

      <section class="toolbar card">
        <label class="search-field">
          <span>搜索</span>
          <input id="search" type="search" placeholder="QQ、名称或头衔" />
        </label>
        <button id="refresh" type="button">刷新数据库</button>
        <span id="count" class="muted"></span>
      </section>

      <section class="workspace">
        <div class="table-card card">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>QQ</th>
                  <th>用户名称</th>
                  <th>用户头衔</th>
                  <th>用户颜色</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="profile-list"></tbody>
            </table>
          </div>
          <div id="empty" class="empty" hidden>数据库中还没有匹配的用户记录。</div>
        </div>

        <form id="editor" class="editor card" hidden>
          <div class="editor-heading">
            <div>
              <p class="eyebrow">PROFILE</p>
              <h2 id="editor-title">新增用户</h2>
            </div>
            <button id="close-editor" class="icon-button" type="button" aria-label="关闭">×</button>
          </div>
          <label>QQ<input id="qq" name="qq" inputmode="numeric" required /></label>
          <label>用户名称<input id="name" name="name" maxlength="64" placeholder="留空时使用缓存昵称" /></label>
          <label>用户头衔<input id="title" name="title" maxlength="64" /></label>
          <label>
            用户颜色
            <select id="color" name="color">
              <option value="1">灰色 · #B5B6B5</option>
              <option value="2">紫色 · #D69AFF</option>
              <option value="3">黄色 · #FFC629</option>
              <option value="4">绿色 · #52D7C5</option>
            </select>
          </label>
          <div class="form-actions">
            <button id="cancel" type="button">取消</button>
            <button class="primary" type="submit">保存到数据库</button>
          </div>
        </form>
      </section>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
